<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>母子留学ビザ診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 明るく元気、でも中身はていねい。「マレーシア母子留学チャンネル」と同じ世界
   IDEA: チャンネルのサムネイル（青空・ヤシの葉・ハイビスカス・KLの街並み）がそのまま診断の入口
   PICTURE: 晴れたクアラルンプールの空と街並み、かなママのアイコン、紺の太丸ゴシック＋黄色のブラシ線
   COLOUR and TYPE: 空色＋紺＋ハイビスカス赤＋黄色、葉の緑／M PLUS Rounded 1c + Noto Sans JP
   LAYOUT: 全幅の空バナー → 白いカードが重なって質問 → 結果。スマホは縦積み */
:root{color-scheme:light dark;
--bg:light-dark(#eaf6ff,#0c1a33);--card:light-dark(#ffffff,#13264a);--ink:light-dark(#1b2a52,#eef3ff);--sub:light-dark(#5b6788,#a9b7d6);
--line:light-dark(#dbe7f3,#25406e);--acc:light-dark(#e2303c,#ff6b74);--navy:light-dark(#1b2a6b,#b9cbff);--yel:#ffd23f;
--sky1:light-dark(#1f86e0,#0b2a5c);--sky2:light-dark(#62b8f2,#1c4f8c);--sky3:light-dark(#d4efff,#3a6aa3);
--bld:light-dark(#d6e6f4,#2b4a78);--bld2:light-dark(#b8cfe4,#203b63);--cloud:light-dark(#ffffff,#9db8de);
--work:#e0405a;--remote:#2c79d6;--study:#8455d6;--guard:#e08a0c;--short:#2f9a5a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans JP",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.stamp,.btn,.opt b,.when strong{font-family:"M PLUS Rounded 1c","Noto Sans JP",sans-serif}
.hero{position:relative;overflow:hidden;min-height:clamp(380px,46vw,470px);background:linear-gradient(180deg,var(--sky1),var(--sky2) 55%,var(--sky3));display:grid;place-items:center;padding:28px max(4vw,16px) 120px}
.hero>svg{position:absolute;inset:0;width:100%;height:100%}
.ttl{position:relative;display:flex;align-items:center;gap:clamp(14px,3vw,28px);max-width:900px}
.ava{flex:none;width:clamp(104px,15vw,150px);aspect-ratio:1;border-radius:50%;border:5px solid #fff;box-shadow:0 8px 24px -8px rgb(10 40 90/.5);background:#fff center/cover}
.ttl h1{margin:0;font-weight:800;font-size:clamp(30px,5.6vw,54px);line-height:1.12;color:#1b2a6b;paint-order:stroke fill;-webkit-text-stroke:7px #fff;text-wrap:balance}
.ttl h1 span{display:block;font-size:.62em}
.brush{display:block;width:min(100%,420px);height:16px;margin:6px 0 12px}
.pill{display:inline-block;background:#fff;color:#1b2a6b;font-weight:700;border-radius:999px;padding:8px 20px;font-size:clamp(14px,2vw,16px);box-shadow:0 6px 18px -10px rgb(10 40 90/.6)}
.pill::before,.pill::after{content:"";display:inline-block;width:10px;height:14px;margin:0 8px -2px;background:linear-gradient(var(--yel),var(--yel)) left/3px 100% no-repeat;transform:rotate(-25deg)}
.pill::after{transform:rotate(25deg)}
.wrap{position:relative;max-width:760px;margin:-96px auto 0;padding:0 max(4vw,14px) 48px}
.card{background:var(--card);border-radius:26px;padding:clamp(22px,4vw,34px);box-shadow:0 18px 40px -22px rgb(20 50 110/.55);border:3px solid light-dark(#fff,#25406e)}
.prog{display:flex;gap:6px;margin-bottom:18px}.prog i{flex:1;height:8px;border-radius:4px;background:var(--line)}.prog i.on{background:var(--yel)}
.qn{font-size:14px;color:var(--acc);font-weight:700;margin:0}
.q{font-size:clamp(21px,3.6vw,27px);line-height:1.35;margin:4px 0 6px;color:var(--navy)}
.hint{color:var(--sub);margin:0 0 18px;font-size:15px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;min-height:66px;padding:12px 16px;border:2px solid var(--line);border-radius:18px;background:transparent;color:inherit;font:inherit;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.opt:hover{border-color:var(--c,var(--acc));background:color-mix(in srgb,var(--c,var(--acc)) 8%,transparent);transform:translateY(-1px)}
.opt:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.dot{flex:none;width:16px;height:16px;border-radius:50%;background:var(--c,var(--acc));box-shadow:0 0 0 4px color-mix(in srgb,var(--c,var(--acc)) 20%,transparent)}
.opt b{display:block;font-weight:700;font-size:17px}.opt small{display:block;color:var(--sub);font-size:14px;line-height:1.5}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{min-height:46px;padding:10px 20px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:inherit;font-size:15px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 6px 14px -6px var(--acc)}
input[type=month]{font:inherit;font-size:16px;min-height:50px;padding:8px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:inherit;width:100%;max-width:260px}
/* result */
.res-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.stamp{width:122px;height:122px;border-radius:50%;border:4px double var(--c);color:var(--c);display:grid;place-items:center;text-align:center;font-size:15px;font-weight:800;line-height:1.25;transform:rotate(-12deg);padding:12px;background:color-mix(in srgb,var(--c) 6%,transparent);animation:pop .5s ease-out}
@keyframes pop{from{transform:rotate(-30deg) scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}.opt{transition:none}}
.lbl{font-size:14px;color:var(--sub);margin:0}
.visa{font-size:clamp(25px,4.6vw,34px);line-height:1.25;margin:2px 0 8px;color:var(--c);font-weight:800}
.when{margin:18px 0 6px;padding:14px 18px;border-radius:18px;background:color-mix(in srgb,var(--yel) 22%,transparent)}
.when strong{font-size:clamp(20px,3.6vw,25px);color:var(--navy)}
.warn{color:var(--acc);font-weight:700}
h3{font-size:19px;margin:28px 0 10px;color:var(--navy)}
.track{position:relative;height:10px;border-radius:5px;background:var(--line);margin:36px 8px 8px}
.track .fill{position:absolute;inset:0;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 30%,transparent),var(--c))}
.track .pin{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--card);border:4px solid var(--c)}
.track .pin span{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:13px;white-space:nowrap;color:var(--sub)}
.track .pin.end{background:var(--c)}
.steps{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:7.6em minmax(0,1fr);gap:12px;align-items:baseline;padding:10px 0;border-top:2px dotted var(--line)}
.steps .t{font-weight:700;color:var(--c);white-space:nowrap;font-size:15px}
.dh{font-weight:700;margin:16px 0 6px;color:var(--c)}ul.chk{list-style:none;margin:0;padding:0;display:grid;gap:2px}ul.chk label{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-radius:10px;cursor:pointer}ul.chk label:hover{background:color-mix(in srgb,var(--c) 6%,transparent)}ul.chk input{flex:none;width:20px;height:20px;margin-top:4px;accent-color:var(--c)}ul.chk input:checked+span{color:var(--sub);text-decoration:line-through}ul.notes{margin:0;padding-left:1.2em}ul.notes li{margin:4px 0}ul.notes li::marker{color:var(--acc)}
.kid{margin-top:20px;padding:16px 18px;border-radius:18px;background:light-dark(#1b2a6b,#0a1630);color:#fff}
.kid b{color:var(--yel)}
.alt{margin-top:14px;padding:12px 16px;border-left:5px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent);border-radius:0 14px 14px 0}
.foot{font-size:13px;color:var(--sub);margin-top:24px;line-height:1.7}
.foot a{color:var(--navy)}
.note{display:flex;align-items:center;gap:12px;margin-top:22px;padding:14px 18px;border-radius:18px;background:var(--card);color:var(--ink);text-decoration:none;border:2px solid var(--line);font-weight:700}
.note img{width:44px;height:44px;border-radius:50%}
.note span{flex:1}.note i{font-style:normal;color:var(--acc)}
@media(max-width:600px){.pill{font-size:13px;white-space:nowrap;padding:8px 14px}.pill::before,.pill::after{display:none}.note i{display:none}.ttl{flex-direction:column;text-align:center}.brush{margin-inline:auto}.res-top{grid-template-columns:1fr}.stamp{width:96px;height:96px;font-size:13px;justify-self:end;margin-top:-8px;order:-1}.steps li{grid-template-columns:1fr;gap:2px}}
</style>
</head>

  steps:[[12,'大学・大学院を決める'],[11,'その学校の出願に必要な英語スコア（IELTSなど）を確認する（作者のMBAはIELTS Academic Overall 6.0以上）'],[10,'足りなければ、英語スコアを取得する','期間は人による','no'],[8,'必要書類をそろえて出願する（下のチェックリスト参照）'],[7,'条件付き合格（Conditional Offer）→ 条件を満たして正式合格（Full Offer）。作者の例では約1週間'],[4,'合格後、学校経由で学生ビザを申請（EMGSの審査は4〜6週間が目安）'],[2,'ビザ承認レター（eVAL）を受け取る。子どもの手続きを学校に確認'],[1,'入国後、健康診断とビザの貼り付け手続き']],
  docs:[
   ['出願のとき（エージェント経由で提出）',['IELTS Academicのスコア（作者の大学院はOverall 6.0以上）','大学の卒業証明書（英文）','大学の成績証明書（英文）','パスポート（顔写真のページ）','履歴書','証明写真','（補足として）昔のTOEICスコア']],
   ['合格後、学生ビザの申請のとき',['証明写真（白背景・35×45mm）','パスポートの全ページ（白紙のページも）のスキャン','パスポートの残り期間が18か月以上あるか確認','「Class 10th」→ 中学校の卒業証書＋英訳','「Class 12th」→ 高校の卒業証書＋英訳','大学の卒業証明書・成績証明書（出願時と同じもの）','大学のオファーレター（合格通知）','Health Declaration Form（健康申告書）に記入・署名','IELTSのスコア']],
   ['ほかに用意したもの',['英文の予防接種記録（母子手帳や昔の接種証明から作成）','結婚の証明書類の英訳：旧姓と今の名前が同一人物だと示すため']],
   ['入学手続きの日に持っていくもの',['中学・高校・大学の卒業証明書・成績証明書の原本すべて']]],
  tips:['書類リストがインドの学校制度を前提に書かれていることも。「Class 10th／12th」は中学・高校の卒業のことでした','中学・高校の成績証明書は、日本では保存期間が卒業後5年ほどの学校が多く、15年以上たつと取れません。卒業証書だけ出して、大学の成績証明書で代えられるか相談しました','中学・高校の卒業証書が旧姓のときは、英訳に「現在は結婚後の姓」と1行書き添えました','健康申告書は差し戻されました。チェックは枠の中に、日付は日/月/年（dd/mm/yyyy）で。YES／NOの意味が直感と逆のこともあるので（作者のフォームではYES＝その症状なし）、設問をよく読んで','パスポート全ページのスキャンは約27MBになり、メールで送れなかったので圧縮しました'],
  notes:['このルートの安心な点：お母さんの学生ビザは入国前に承認（eVAL）が出るので、ガーディアンビザのように「入国後、ビザが下りるまで滞在資格をつなぐ」心配が少なくなります（作者はこのルート）','英語スコアの取得にかかる期間は、今の英語力によって大きく変わります。スコアが必要な場合は、ここがいちばん長くなりやすいので早めに確認を','卒業証明書・成績証明書は、大学だけでなく高校・中学の分まで求められることがあります。英文での発行に時間がかかる学校もあります','子どもを家族として連れて行けるのは、大学院（修士・博士）の学生ビザの場合です。語学学校・職業訓練校などの学生ビザでは家族を連れて行けません','パスポートの残り期間に条件があります（18か月以上を求める案内もあります）。学校に確認を']},
 guardian:{c:'--guard',visa:'ガーディアンビザ',stamp:'GUARDIAN<br>PASS',lead:'子どもの学生ビザに付き添う親のためのビザです。子どもの学生ビザを取ったあとに申請できます。',
  steps:[[8,'子どもの留学エージェントに連絡して、学校の情報を集める'],[6,'候補を2校ほどにしぼって親子で現地を下見し（エージェントのスクールツアーを利用）、学校を決めて必要書類をそろえ、願書を提出'],[5,'子どもが学校の入学テストを受け、合格するとオファーレター（入学許可書）が届く'],[4,'日本にいる間に、学校経由で教育省（MOE）の承認レターを出してもらう（作者の学校では約1か月半）'],[1,'MOEの承認レターを持って日本を出国し、マレーシアに入国','出発'],[0,'入国後、子どもの学生ビザ（Student Pass）の申請に入る。取得まで3〜4か月と言われている','入国後〜'],[0,'子どもの学生ビザが取れたら、ガーディアンビザを申請。そこからさらに3〜4か月','入国3〜4か月後〜']],
  notes:['<b>ビザの申請中は、マレーシア国外に出られません。</b>子どもの学生ビザ→ガーディアンビザと続くと、入国後6〜8か月ほど一時帰国や近隣国への旅行ができない可能性があります','<b>審査中のお母さんの滞在資格</b>：入国はビザなし（最長90日）で入るのが一般的です。90日を過ぎそうなときは、学校経由で特別パス（Special Pass、1回30日・入国管理局の裁量）を申請したり、学校によっては期限前に一度出国して入り直すよう案内されたりします。オーバーステイ（不法滞在）にならないよう、必ず学校の指示に従ってください','作者の例：5月に留学エージェントから情報収集 → 7月上旬に親子で現地の学校を下見して決定 → 7月中に願書提出 → 8月に子どもの入学テスト → 8月末にオファーレター。情報収集から合格まで約4か月でした','いわゆる「母子留学」でいちばん多い形です','生徒1人につき保護者1名が一般的です（学校の案内による）。7歳未満のきょうだいも、一緒に滞在できる対象に含まれています','子どもの学生ビザは、入国管理局の案内では3歳以上が対象ですが、7歳未満には出せないと案内する学校もあります。小さい子だけで行く場合は、必ず学校に確認してください','このビザではマレーシア国内で働けません','学校によって手続きの流れが違うので、出願時に必ず確認してください']}
};
let ans={},hist=[];
const flow=()=>{const f=['period'];if(ans.period==='long'){f.push('style');if(ans.style==='remote')f.push('job','income','contract');if(ans.style==='study')f.push('eng');if(ans.style!=='guardian')f.push('school')}f.push('dep');return f};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function render(){
 const f=flow(),key=f.find(k=>!(k in ans));
 if(!key)return result();
 const i=f.indexOf(key),q=Q[key];
 let qt=q.q;if(key==='income')qt=ans.job==='it'?'年収は約570万円（3.6万ドル）以上ありますか？':'年収は約950万円（6万ドル）以上ありますか？';
 const prog=f.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join('');
 const body=q.month?`<label for="dep" class="lbl">出発予定の月</label><br><input type="month" id="dep" value="${defMonth()}"><div class="nav"><button class="btn" id="back">戻る</button><button class="btn pri" id="go">結果を見る</button></div>`
  :`<div class="opts">${q.opts.map(o=>`<button class="opt" data-v="${o.v}" style="--c:var(${o.c})"><span class="dot"></span><span><b>${o.t}</b>${o.s?`<small>${o.s}</small>`:''}</span></button>`).join('')}</div>${i?'<div class="nav"><button class="btn" id="back">戻る</button></div>':''}`;
 app.innerHTML=`<div class="prog">${prog}</div><p class="qn">質問 ${i+1}</p><h2 class="q">${qt}</h2>${q.hint?`<p class="hint">${q.hint}</p>`:''}${body}`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[key]=b.dataset.v;hist.push(key);render()});
 const bk=document.getElementById('back');if(bk)bk.onclick=back;
 const go=document.getElementById('go');if(go)go.onclick=()=>{ans.dep=document.getElementById('dep').value||'';hist.push('dep');render()};
 const first=app.querySelector('.opt,#dep');if(first&&hist.length)first.focus();
}
function back(){const k=hist.pop();if(k)delete ans[k];
 for(const x of Object.keys(ans))if(!flow().includes(x))delete ans[x];render()}
function defMonth(){const d=new Date();d.setMonth(d.getMonth()+6);return d.toISOString().slice(0,7)}
function ym(s,off){const[y,m]=s.split('-').map(Number);const d=new Date(y,m-1-off,1);return{d,txt:`${d.getFullYear()}年${d.getMonth()+1}月`}}
function result(){
 const k=ans.period==='short'?'short':ans.style,r=R[k];
 const ng=k==='remote'&&ans.income==='no',fl=k==='remote'&&ans.contract==='freelance';
 const st=r.steps.filter(x=>!x[3]||x[3]===ans.eng);
 const max=st[0][0],scale=Math.max(max,3);
 let when=`出発の <strong>${max}か月前</strong> から準備を始めるのが目安です。`;
 if(ans.dep){const s=ym(ans.dep,max),now=new Date();now.setDate(1);
  when=`<strong>${s.txt}ごろ</strong>までに準備スタート<br><span class="lbl">出発（${ym(ans.dep,0).txt}）の${max}か月前</span>`;
  if(s.d<new Date(now.getFullYear(),now.getMonth(),1))when+=`<br><span class="warn">今からだと少しタイトです。まずはいちばん上のステップから急ぎましょう。</span>`}
 const pins=st.filter(x=>!x[2]).map(([m],i)=>`<span class="pin" style="left:${(scale-m)/scale*100}%">${i?'':`<span>${m}か月前</span>`}</span>`).join('')+`<span class="pin end" style="left:100%"><span>出発</span></span>`;
 const KID={
  guardian:'ガーディアンビザは、<b>子どもの学生ビザ（Student Pass）が前提</b>です。子どもの学生ビザが取れてから申請できます。',
  remote:'DE Rantauの家族ビザでは学校に通えません。<b>子どもの学生ビザ（Student Pass）を学校経由で申請</b>します（MDEC公式FAQより）。作者の子どもの学校では、日本にいる間に教育省（MOE）の承認レター（約1か月半）→ 入国後に学生ビザを申請（3〜4か月）という流れで、<b>申請中はマレーシア国外に出られません</b>。',
  work:'就労ビザの家族は<b>家族ビザ（Dependant Pass）で学校に通える場合があります</b>。学校によっては子どもの学生ビザを求められることもあるので、出願時に確認してください。',
  study:'大学院（修士・博士）の学生なら、子どもは<b>家族ビザ（Dependant Pass）で学校に通えます</b>（通学の許可申請が必要）。大学によっては子どもの学生ビザを求められることもあります。'};
 const kid=(k==='guardian'||(k!=='short'&&ans.school==='yes'))
  ?`<div class="kid">${KID[k]}${k==='guardian'?'':'<br>子どもの学校探しは、留学エージェントへの相談→現地の下見→出願→入学テスト→オファーレターと進み、作者の例では約4か月かかりました。親のビザの準備と並行して進めましょう。'}</div>`:'';
 const alt=ng?`<div class="alt"><b>年収が基準に届かない場合</b><br>DE Rantauは難しい可能性が高いです。お子さんが現地の学校に通うなら「ガーディアンビザ」で付き添い、仕事の形を見直す選択肢もあります（ガーディアンビザでは現地で働けません）。</div>`:'';
 const emp=k==='remote'&&ans.contract==='employee'?`<div class="alt"><b>まず確認：会社の制度で「海外に住んだまま働くこと」が認められていますか？</b><br>1年以上住むと住民票を抜いて「海外在住」になります。法律上は雇用を続けられますが、会社には税金・社会保険・労務管理・情報セキュリティの対応が新たに必要になるため、認めていない会社が多いのが実情です。就業規則や人事に、出発前に必ず確認してください。</div>`:'';
 const fla=fl?`<div class="alt"><b>注意：日本の案件を業務委託で受けるのは難しいことが多いです</b><br>セキュリティなどの理由で、「海外からのリモート」という時点で断られることがよくあります。出発前に取引先へ確認しておきましょう。</div>`:'';
 app.innerHTML=`<div style="--c:var(${r.c})">
 <div class="res-top"><div><p class="lbl">あなたに必要なビザ</p><h2 class="visa">${r.visa}</h2><p style="margin:0">${r.lead}</p></div><div class="stamp" aria-hidden="true">${r.stamp}</div></div>
 ${alt}${emp}${fla}
 <div class="when">${when}</div>
 <h3>準備タイムライン</h3>
 <div class="track"><div class="fill"></div>${pins}</div>
 <ol class="steps">${st.map(([m,t,l])=>`<li><span class="t">${l||m+'か月前〜'}</span><span>${t}</span></li>`).join('')}</ol>
 ${kid}
 ${k==='short'?'':`<div class="alt" style="border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,transparent)"><b>日本で先に準備しておくもの</b><br>戸籍・出生証明の英訳や認証（公的書類であることの証明手続き）など。現地に着いてからでは取り寄せに時間がかかります。${'学校探し・出願・ビザ・仕事の調整を並行すると、思った以上に時間がかかります。'}</div>`}
 ${r.docs?`<h3>必要書類チェックリスト（作者の例）</h3><p class="lbl">学校によって違うので、必ず自分の学校のリストで確認してください。チェックはこの画面の中だけで使えます。</p>${r.docs.map(([h,items])=>`<p class="dh">${h}</p><ul class="chk">${items.map(t=>`<li><label><input type="checkbox"><span>${t}</span></label></li>`).join('')}</ul>`).join('')}<h3>つまずいたところ（作者の体験から）</h3><ul class="notes">${r.tips.map(t=>`<li>${t}</li>`).join('')}</ul>`:''}
 <h3>知っておきたいこと</h3><ul class="notes">${r.notes.map(n=>`<li>${n}</li>`).join('')}</ul>
 <a class="note" href="../" style="margin-top:24px"><span>次は、このルートの準備リストをつくろう<br><small style="font-weight:400;color:var(--sub)">おやこ旅支度：滞在期間や過ごし方から、わが家の準備TODOを作れます</small></span><i>つくる →</i></a>
 <div class="nav"><button class="btn" id="back">ひとつ戻る</button><button class="btn pri" id="re">最初からやり直す</button></div></div>`;
 document.getElementById('back').onclick=back;
 document.getElementById('re').onclick=()=>{ans={};hist=[];render()};
 app.scrollIntoView({behavior:'smooth',block:'start'});
}
render();
if(innerWidth<600)document.querySelector('.hero>svg').setAttribute('preserveAspectRatio','xMaxYMax slice');
}
</script>
</body>
